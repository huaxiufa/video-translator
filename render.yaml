services:
  - type: web
    name: bilingual-video-translator
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      sudo apt-get update
      sudo apt-get install -y ffmpeg fonts-noto-cjk
      python download_model.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 900
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WHISPER_MODEL
        value: "tiny.en"
      - key: WHISPER_DEVICE
        value: "cpu"
      - key: WHISPER_COMPUTE_TYPE
        value: "int8"
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: FFMPEG_PRESET
        value: "veryfast"
      - key: FFMPEG_CRF
        value: "23"
