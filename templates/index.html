<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>英文视频 → 中英双语字幕</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="badge">FREE · WHISPER + GOOGLE TRANSLATE</div>
      <h1>英文视频 → 中英双语字幕</h1>
      <p class="sub">上传视频 → 自动识别英文 → Google 免费网页翻译 → 生成双语字幕视频</p>

      <form id="uploadForm">
        <label class="drop" id="drop">
          <input id="video" name="video" type="file" accept="video/*" hidden>
          <div class="icon">↑</div>
          <strong>点击选择视频</strong>
          <span>或把视频拖到这里</span>
          <small>MP4 / MOV / MKV / WEBM / AVI / M4V · 最大 {{ max_upload_mb }} MB</small>
        </label>

        <div id="fileName" class="filename"></div>
        <button id="submit" type="submit" disabled>开始生成双语字幕</button>
      </form>

      <div id="progressBox" class="progressBox hidden">
        <div class="row"><span id="message">准备中…</span><span id="percent">0%</span></div>
        <div class="bar"><div id="bar"></div></div>
      </div>

      <div id="result" class="result hidden"></div>
      <div id="error" class="error hidden"></div>
    </section>

    <section class="info">
      <div><b>① Whisper</b><span>自动识别英文语音</span></div>
      <div><b>② Google</b><span>无需 API Key 的 Google 网页翻译</span></div>
      <div><b>③ FFmpeg</b><span>烧录中英双语字幕并输出 MP4</span></div>
    </section>

    <p class="note">提示：Render 免费实例会在闲置 15 分钟后休眠，首次唤醒可能约需 1 分钟；上传/处理文件保存在临时磁盘，服务重启后会清理。</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
